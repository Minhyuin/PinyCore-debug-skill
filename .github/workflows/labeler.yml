name: Labeler

# PinyCore's labeler maps both the head branch and the changed files; this keeps the same two
# dimensions because the branch name is the one piece of metadata a contributor always sets.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label the pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
